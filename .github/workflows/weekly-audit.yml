name: Weekly Security Audit Fix

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-and-create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit fix
        run: npm audit fix --no-fund

      - name: Validate project integrity (Lint)
        run: npm run lint

      - name: Validate project compilation (Build)
        run: npm run build

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): weekly npm audit fix'
          branch: 'chore/automated-npm-audit-fix'
          delete-branch: true
          title: 'chore(deps): weekly npm audit fix'
          body: |
            ### Automated Security Audit Update
            - Executed `npm audit fix` on schedule.
            - Passed project linting (`npm run lint`).
            - Passed project compilation (`npm run build`).

            Please verify the Netlify Deploy Preview before merging.
          labels: |
            dependencies
            automated-pr
